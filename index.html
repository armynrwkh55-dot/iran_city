
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ایران سیتی</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Tahoma;background:#8bd8ff}
canvas{display:block}
#title{position:fixed;top:12px;right:12px;color:white;background:#123b32dd;padding:12px;border-radius:14px;font-weight:bold;z-index:2}
#info{position:fixed;top:65px;right:12px;color:white;background:#123b32bb;padding:8px;border-radius:10px;font-size:12px;z-index:2}
#pad{position:fixed;bottom:20px;left:15px;display:grid;grid-template-columns:55px 55px 55px;gap:5px;z-index:3}
button{height:55px;border:2px solid white;border-radius:15px;background:#163f42dd;color:white;font-size:22px;touch-action:none}
#up{grid-column:2}#left{grid-column:1}#down{grid-column:2}#right{grid-column:3}
#run{position:fixed;bottom:25px;right:18px;width:75px;height:65px;font-size:14px;z-index:3}
#help{position:fixed;bottom:155px;left:15px;color:white;background:#123b32bb;padding:8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="title">🇮🇷 ایران سیتی</div>
<div id="info">شهر کارتونی | نسخه ۱</div>
<div id="help">با دکمه‌ها شهر را بگرد!</div>
<div id="pad">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<button id="run">دویدن 🏃</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bd8ff);
scene.fog=new THREE.Fog(0x8bd8ff,65,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x63754b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,60,30);
sun.castShadow=true;
scene.add(sun);

function material(c){return new THREE.MeshStandardMaterial({color:c})}
const grass=material(0x66b85d);
const asphalt=material(0x454b55);
const sidewalk=material(0xd8c7a4);
const glass=material(0x8be0f0);

function cube(w,h,d,c,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

cube(400,.2,400,0x66b85d,0,-.2,0);

// خیابان‌های شهر
for(let i=-4;i<=4;i++){
 let p=i*30;
 cube(9,.08,300,0x454b55,p,0,0);
 cube(300,.08,9,0x454b55,0,0,p);
 cube(1,.03,300,0xffffff,p+5,0.05,0);
 cube(300,.03,1,0xffffff,0,0.05,p+5);
}

// ساختمان‌های رنگی
const colors=[0xffb65c,0xf18b83,0xf4df9c,0x9baddf,0xf3eee0,0x83c8a0];
for(let x=-4;x<=4;x++){
 for(let z=-4;z<=4;z++){
  if(Math.random()<.25)continue;
  let bx=x*30+15,bz=z*30+15;
  if(Math.abs(bx)<15&&Math.abs(bz)<15)continue;
  let w=8+Math.random()*6;
  let d=8+Math.random()*6;
  let h=7+Math.random()*19;
  cube(w,h,d,colors[Math.floor(Math.random()*colors.length)],bx,h/2,bz);
  for(let yy=2;yy<h-1;yy+=3){
   for(let xx=-w/2+1.5;xx<w/2-1;xx+=2.5){
    cube(1,1,.06,0x80d9ee,bx+xx,yy,bz+d/2+.04);
   }
  }
  cube(w+.3,.35,d+.3,0xf3dfbd,bx,h+.15,bz);
 }
}

// درخت‌ها
for(let i=0;i<100;i++){
 let x=(Math.random()-.5)*240;
 let z=(Math.random()-.5)*240;
 if(Math.abs(x%30)<7||Math.abs(z%30)<7)continue;
 cube(.5,2,.5,0x80502c,x,1,z);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.5,8,7),
  material(0x278b4c)
 );
 leaves.position.set(x,3,z);
 scene.add(leaves);
}

// شخصیت کارتونی
const player=new THREE.Group();
scene.add(player);

function part(geo,c,x,y,z){
 const m=new THREE.Mesh(geo,material(c));
 m.position.set(x,y,z);
 m.castShadow=true;
 player.add(m);
 return m;
}

part(new THREE.CapsuleGeometry(.45,.8,4,8),0x2378d0,0,1.25,0);
part(new THREE.SphereGeometry(.4,12,10),0xf0bd91,0,2.15,0);
part(new THREE.SphereGeometry(.41,12,8,0,Math.PI*2,0,Math.PI*.5),0x38251c,0,2.32,0);

for(let x of [-.15,.15]){
 part(new THREE.SphereGeometry(.045,8,8),0x222222,x,2.17,.35);
 part(new THREE.CapsuleGeometry(.15,.55,3,6),0x34445c,x*.65,.4,0);
}
for(let x of [-.53,.53]){
 part(new THREE.CapsuleGeometry(.13,.55,3,6),0x2378d0,x,1.3,0);
}

const keys={up:false,down:false,left:false,right:false};
for(const k of Object.keys(keys)){
 const b=document.getElementById(k);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[k]=true;
  b.setPointerCapture(e.pointerId);
 });
 const release=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerup',release);
 b.addEventListener('pointercancel',release);
 b.addEventListener('lostpointercapture',()=>keys[k]=false);
}

let running=false;
document.getElementById('run').onclick=()=>{
 running=!running;
 document.getElementById('run').style.background=running?'#bd672e':'#163f42dd';
};

const keyboard={};
addEventListener('keydown',e=>keyboard[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keyboard[e.key.toLowerCase()]=false);

let angle=0,last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 let dt=Math.min((now-last)/1000,.04);last=now;
 let forward=keys.up||keyboard.w||keyboard.arrowup;
 let back=keys.down||keyboard.s||keyboard.arrowdown;
 let left=keys.left||keyboard.a||keyboard.arrowleft;
 let right=keys.right||keyboard.d||keyboard.arrowright;

 let dx=(right?1:0)-(left?1:0);
 let dz=(back?1:0)-(forward?1:0);
 if(dx||dz){
  let len=Math.hypot(dx,dz);
  dx/=len;dz/=len;
  let speed=running?10:5;
  player.position.x+=dx*speed*dt;
  player.position.z+=dz*speed*dt;
  player.rotation.y=Math.atan2(dx,dz);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-135,135);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-135,135);

 let behind=new THREE.Vector3(0,5,-8).applyAxisAngle(
  new THREE.Vector3(0,1,0),player.rotation.y
 );
 let target=new THREE.Vector3(
  player.position.x,player.position.y+1,player.position.z
 );
 camera.position.lerp(target.clone().add(behind),.12);
 camera.lookAt(target.x,target.y+1,target.z);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
