<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ایران سیتی | رانندگی آزاد</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8bb8d8;font-family:Tahoma,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#title{position:absolute;top:12px;left:12px;background:#101827cc;padding:10px 14px;border-radius:12px;font-weight:bold}
#speed{position:absolute;top:68px;left:12px;background:#101827cc;padding:10px;border-radius:10px}
#hint{position:absolute;top:12px;right:12px;background:#101827bb;padding:9px;border-radius:10px;font-size:12px}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:auto}
.group{display:flex;gap:12px;align-items:end}
button{width:66px;height:66px;border:2px solid #ffffffa0;border-radius:18px;background:#142033cc;color:white;font-size:26px;font-weight:bold;touch-action:none}
button:active{background:#3284d8}
#gas{height:82px;background:#167448dd}
#brake{height:70px;background:#a52d36dd}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101827;color:white;text-align:center;padding:25px;z-index:5}
#loading small{display:block;margin-top:12px;color:#cbd5e1}
</style>
</head>
<body>
<div id="loading">در حال ساخت شهر سه‌بعدی...
<small>برای بارگذاری، اتصال اینترنت لازم است.</small></div>
<div id="hud">
  <div id="title">IRAN CITY</div>
  <div id="speed">سرعت: <span id="km">0</span> km/h</div>
  <div id="hint">رانندگی آزاد · نمای سوم‌شخص</div>
  <div id="controls">
    <div class="group">
      <button id="left">◀</button><button id="right">▶</button>
    </div>
    <div class="group">
      <button id="brake">■</button><button id="gas">▲</button>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading=document.getElementById('loading');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c5e8);
scene.fog=new THREE.Fog(0x91c5e8,100,420);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x65715a,2));
const sun=new THREE.DirectionalLight(0xfff0d8,3);
sun.position.set(-45,80,35);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
scene.add(sun);

function mat(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x829875));
ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);

// خیابان اصلی
const road=new THREE.Mesh(new THREE.PlaneGeometry(18,1000),mat(0x30343a));
road.rotation.x=-Math.PI/2;road.position.y=.01;road.receiveShadow=true;scene.add(road);
for(let z=-490;z<500;z+=12){
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(.18,.025,5),mat(0xf4e8bd));
 stripe.position.set(0,.04,z);scene.add(stripe);
}
for(const x of [-9,9]){
 const curb=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,1000),mat(0xbab9af));
 curb.position.set(x,.05,0);scene.add(curb);
}
const buildingMats=[0xc6b9a3,0xd8d1c4,0xb7c4c8,0xc8ad91,0x9eaeb1,0xe0d8c8].map(c=>mat(c));
const windowMat=new THREE.MeshStandardMaterial({color:0x35586c,roughness:.25,metalness:.3});
function box(w,h,d,material,x,y,z,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;
}
for(let z=-450;z<=450;z+=22){
 for(const side of [-1,1]){
  const w=8+Math.random()*9,h=9+Math.random()*28,d=12+Math.random()*8;
  const x=side*(15+w/2+Math.random()*5);
  box(w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],x,h/2,z+Math.random()*6);
  // پنجره‌های جلوی ساختمان
  for(let yy=2.5;yy<h-1;yy+=3.3){
   for(let xx=-w/2+1.5;xx<w/2-1;xx+=2.6){
    box(.95,1.35,.06,windowMat,x+xx,yy,z+d/2+.04,false);
   }
  }
 }
}

// ساخت ماشین با بدنه براق و جزئیات
const car=new THREE.Group();scene.add(car);
const paint=new THREE.MeshPhysicalMaterial({color:0x9c1824,metalness:.72,roughness:.24,clearcoat:1,clearcoatRoughness:.12});
const dark=mat(0x151a20,.28,.25);
const glass=new THREE.MeshPhysicalMaterial({color:0x142d3b,metalness:.45,roughness:.13,clearcoat:1});
const chrome=mat(0xc7cbd0,.18,.85);
function carPart(w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;car.add(m);return m;
}
carPart(2.05,.55,4.5,paint,0,.8,0);
carPart(1.9,.3,4.0,paint,0,1.12,-.03);
carPart(1.7,.67,2.0,paint,0,1.52,-.25);
carPart(1.58,.48,1.75,glass,0,1.57,-.25);
carPart(1.95,.08,1.6,paint,0,1.92,-.25);
carPart(1.7,.12,1.2,paint,0,1.17,1.2);
carPart(1.7,.12,1.2,paint,0,1.17,-1.45);
// جلوپنجره و چراغ‌ها
carPart(.68,.23,.06,dark,0,.82,2.27);
for(const x of [-.72,.72]){
 const lamp= new THREE.MeshStandardMaterial({color:0xfff2cf,emissive:0xffd88a,emissiveIntensity:1.2});
 carPart(.42,.17,.07,lamp,x,1.0,2.28);
 carPart(.38,.15,.07,mat(0xb91c2b),x,1.0,-2.28);
 carPart(.13,.25,.08,chrome,x,.82,2.31);
}
// چرخ‌ها
const wheels=[];
for(const x of [-1.02,1.02]){
 for(const z of [-1.42,1.42]){
  const wheel=new THREE.Group();wheel.position.set(x,.53,z);car.add(wheel);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,32),dark);
  tire.rotation.z=Math.PI/2;tire.castShadow=true;wheel.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.27,12),chrome);
  rim.rotation.z=Math.PI/2;wheel.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.28,16),dark);
  hub.rotation.z=Math.PI/2;wheel.add(hub);
  wheels.push(wheel);
 }
}
// آینه‌ها
for(const x of [-1.08,1.08]){
 carPart(.22,.14,.24,paint,x,1.35,.48);
}
// سایه نرم مصنوعی
const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.5,32),new THREE.MeshBasicMaterial({color:0x111820,transparent:true,opacity:.28}));
shadow.rotation.x=-Math.PI/2;shadow.scale.set(1,1.7,1);shadow.position.y=.035;car.add(shadow);

car.position.set(0,0,0);
let speed=0,steer=0;
const keys={left:false,right:false,gas:false,brake:false};
function bind(id,key){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[key]=true;};
 const off=e=>{e.preventDefault();keys[key]=false;};
 el.addEventListener('pointerdown',on);
 el.addEventListener('pointerup',off);
 el.addEventListener('pointercancel',off);
 el.addEventListener('pointerleave',off);
}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;
 if(e.key==='ArrowDown'||e.key==='s'||e.key===' ')keys.brake=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;
 if(e.key==='ArrowDown'||e.key==='s'||e.key===' ')keys.brake=false;
});
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
function animate(){
 requestAnimationFrame(animate);
 if(keys.gas)speed=Math.min(speed+0.012,.85);
 else speed*=.992;
 if(keys.brake)speed*=.94;
 const direction=(keys.left?1:0)-(keys.right?1:0);
 steer+=(direction-steer)*.08;
 car.rotation.y+=steer*speed*.035;
 car.position.x+=Math.sin(car.rotation.y)*speed;
 car.position.z+=Math.cos(car.rotation.y)*speed;
 car.position.x=THREE.MathUtils.clamp(car.position.x,-7,7);
 wheels.forEach(w=>w.rotation.x+=speed*.12);
 const back=new THREE.Vector3(0,4.1,-8.5).applyQuaternion(car.quaternion);
 const target=car.position.clone().add(back);
 camera.position.lerp(target,.09);
 const look=car.position.clone().add(new THREE.Vector3(0,1,4).applyQuaternion(car.quaternion));
 camera.lookAt(look);
 document.getElementById('km').textContent=Math.round(speed*110);
 renderer.render(scene,camera);
}
loading.remove();
animate();
</script>
</body>
</html>
